<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interrupteur Interactif Animé</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 400px;
        }

        h2 {
            color: #38bdf8;
            margin-top: 0;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .image-box {
            margin: 25px 0;
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            display: inline-block;
            overflow: hidden;
        }

        img {
            width: 150px;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }

        /* Classe d'animation CSS déclenchée par le JS */
        .animate-swap {
            animation: reveal 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Animation combinant un léger zoom et un fondu lumineux */
        @keyframes reveal {
            0% {
                opacity: 0.3;
                transform: scale(0.95);
                filter: brightness(1.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: brightness(1);
            }
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        button {
            background: #334155;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.on-btn {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
        }

        button.off-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Contrôle d'Attribut Animé</h2>
        <p>L'image profite maintenant d'un effet visuel de transition à chaque fois que son état change.</p>

        <div class="image-box">
            <img id="myImage" src="lionoff.jpg" alt="Affichage interactif">
        </div>

        <div class="controls">
            <button class="on-btn" id="btn-on">🦁 Allumer</button>
            <button class="off-btn" id="btn-off">🌑 Éteindre</button>
        </div>
    </div>

    <script>
        const image = document.getElementById('myImage');
        const btnOn = document.getElementById('btn-on');
        const btnOff = document.getElementById('btn-off');

        function triggerImageSwap(newSrc) {
            // 1. On change la source de l'image
            image.src = newSrc;
            
            // 2. On retire la classe d'animation au cas où elle y était déjà
            image.classList.remove('animate-swap');
            
            // 3. On force le navigateur à recalculer le style pour pouvoir relancer l'animation
            void image.offsetWidth; 
            
            // 4. On ajoute la classe pour lancer l'animation
            image.classList.add('animate-swap');
        }

        btnOn.addEventListener('click', () => {
            triggerImageSwap('lion.jpg');
        });

        btnOff.addEventListener('click', () => {
            triggerImageSwap('lionoff.jpg');
        });
    </script>

</body>
</html>
